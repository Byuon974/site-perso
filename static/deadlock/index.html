<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadlock Learning Load</title>
<style>
/* Polices servies a cote de la page plutot que depuis Google Fonts. Trois raisons :
   la page ne fait plus aucune requete vers un tiers, elle garde sa typographie
   quand on la telecharge pour la lire hors ligne, et le reste du site se sert
   deja de ses propres fichiers. Sous-ensembles latin, 172 Ko pour les 8.
   Les chemins sont relatifs : le dossier se deplace d'un bloc. */
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; font-display: swap;
  src: url('fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 500; font-display: swap;
  src: url('fonts/ibm-plex-sans-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600; font-display: swap;
  src: url('fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 700; font-display: swap;
  src: url('fonts/ibm-plex-sans-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap;
  src: url('fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap;
  src: url('fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 600; font-display: swap;
  src: url('fonts/ibm-plex-mono-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Limelight'; font-style: normal; font-weight: 400; font-display: swap;
  src: url('fonts/limelight-latin-400-normal.woff2') format('woff2'); }
</style>
<style>
/* Layout: one question per page. Each page opens with a status strip (question, answer, key figures against
   their thresholds), then at most a handful of evidence panels. Overview first, evidence after.
   Colour has three jobs only: status (good / watch / serious / critical, always with an icon and a word),
   identity (item slot, game layer) and magnitude (one-hue heat). Brass is the brand accent, never data. */
:root {
  --bg: #eceeea; --panel: #ffffff; --panel-2: #f4f5f1; --line: #d7dbd3; --ink: #171b1c; --ink-2: #3a4241; --muted: #5d6663;
  --brass: #8a6416; --brand: #1d2b2d; --brand-ink: #f3ead6;
  /* status (fixed set, validated): good, warning, serious, critical + info */
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b; --info: #2a78d6;
  --info-solid: #2570cb;
  /* fonds de pastille : les teintes d'identite assombries jusqu'a 4,5:1 sur blanc */
  --av-crit: #b84a1c; --av-mixed: #11704e; --av-pos: #2570cb;
  --good-ink: #146b14; --warn-ink: #7a5300; --serious-ink: #9a4320; --crit-ink: #a52626; --info-ink: #1f5fae;
  --good-bg: #e3f3e1; --warn-bg: #fdf0d2; --serious-bg: #fbe5dc; --crit-bg: #f8dddd; --info-bg: #e0ebfa;
  /* identity: item slots (Deadlock's own colour logic: weapon orange, vitality green, spirit violet) */
  --slot-weapon: #eb6834; --slot-vitality: #1baf7a; --slot-spirit: #6250d6;
  /* identity: game layers */
  --l1: #2a78d6; --l2: #eb6834; --l3: #1baf7a; --l4: #eda100; --l5: #e87ba4;
  /* magnitude: one blue hue */
  --heat: #2a78d6; --seq-1: #86b6ef; --seq-2: #3987e5; --seq-3: #1c5cab; --seq-4: #0d366b;
  /* Type roles: display = brand and page titles only; body = all reading text and every figure (proportional in headlines, tabular in tables and axes); data (mono) = code, file keys and commands only. */
  --font-display: "Limelight", "Didot", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101415; --panel: #181e1f; --panel-2: #1e2627; --line: #2d3839; --ink: #ece7da; --ink-2: #c9c5b8; --muted: #99a29e;
  --brass: #d8b46a; --brand: #0b0f10; --brand-ink: #f3ead6;
  --good-ink: #6fdc6f; --warn-ink: #fac45a; --serious-ink: #f2a17f; --crit-ink: #f08080; --info-ink: #7fb0f0;
  --good-bg: #16301a; --warn-bg: #382a0c; --serious-bg: #3a2216; --crit-bg: #3a1818; --info-bg: #172840;
  --slot-weapon: #d95926; --slot-vitality: #199e70; --slot-spirit: #9085e9;
  --l1: #3987e5; --l2: #d95926; --l3: #199e70; --l4: #c98500; --l5: #d55181;
  --heat: #6da7ec; --seq-1: #b7d3f6; --seq-2: #6da7ec; --seq-3: #2a78d6; --seq-4: #184f95;
  --info-solid: #1d5ca8;
  --av-crit: #b84a1c; --av-mixed: #11704e; --av-pos: #2570cb;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101415; --panel: #181e1f; --panel-2: #1e2627; --line: #2d3839; --ink: #ece7da; --ink-2: #c9c5b8; --muted: #99a29e;
  --brass: #d8b46a; --brand: #0b0f10; --brand-ink: #f3ead6;
  --good-ink: #6fdc6f; --warn-ink: #fac45a; --serious-ink: #f2a17f; --crit-ink: #f08080; --info-ink: #7fb0f0;
  --good-bg: #16301a; --warn-bg: #382a0c; --serious-bg: #3a2216; --crit-bg: #3a1818; --info-bg: #172840;
  --slot-weapon: #d95926; --slot-vitality: #199e70; --slot-spirit: #9085e9;
  --l1: #3987e5; --l2: #d95926; --l3: #199e70; --l4: #c98500; --l5: #d55181;
  --heat: #6da7ec; --seq-1: #b7d3f6; --seq-2: #6da7ec; --seq-3: #2a78d6; --seq-4: #184f95;
  --info-solid: #1d5ca8;
  --av-crit: #b84a1c; --av-mixed: #11704e; --av-pos: #2570cb;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font-body); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 400 clamp(1.75rem, 4.4vw, 2.6rem)/1.08 var(--font-display); letter-spacing: .01em; }
h2 { font: 600 1.02rem/1.3 var(--font-body); }
h3 { font: 600 .92rem/1.3 var(--font-body); }
p { margin: 0; }
a { color: var(--info-ink); }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: .84rem; } /* Les cles de fichiers du client sont de longs jetons sans espace, du genre
   citadel_player_spawn_time_rich_nw_penalty_*. Sans point de coupure, un seul
   d'entre eux debordait son panneau de 62 px et poussait la page entiere :
   mesure a 360 px, 379 px de large sur la page Death. */
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* shell: dark sidebar with grouped pages, sticky top bar with search, content column */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.app.collapsed { grid-template-columns: 0 minmax(0, 1fr); }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--brand); color: var(--brand-ink); display: flex; flex-direction: column; border-right: 3px solid var(--brass); z-index: 40; }
.app.collapsed .side { visibility: hidden; }
.brand { display: flex; align-items: center; gap: 10px; padding: 14px 16px; text-decoration: none; color: var(--brand-ink); border-bottom: 1px solid #263133; }
.brand .logo { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--brass); color: #1a1406; font: 400 1.2rem var(--font-display); flex: none; }
.brand b { display: block; font: 400 1.15rem/1.1 var(--font-display); letter-spacing: .03em; }
.brand small { font: 600 .68rem var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: #d8b46a; }
.snav { padding: 10px 10px 16px; display: flex; flex-direction: column; gap: 2px; }
.snav .grp { font: 600 .68rem var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: #8a948f; padding: 14px 10px 6px; }
.snav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: #cfc9b8; text-decoration: none; font: 500 .9rem var(--font-body); }
.snav a:hover { background: #1c2627; color: #fff; }
.snav a[aria-current="page"] { background: #24302f; color: #fff; box-shadow: inset 3px 0 0 #f3c96b; }
.snav a .w { margin-left: auto; font: 600 .66rem var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: #8a948f; }
.side-foot { white-space: pre-line; margin-top: auto; padding: 12px 16px; border-top: 1px solid #263133; font: .74rem/1.5 var(--font-body); font-variant-numeric: tabular-nums; color: #8a948f; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #6c7471; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.serious { background: var(--serious); } .dot.crit { background: var(--crit); } .dot.info { background: var(--info); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 10px 20px; min-height: 58px; }
.iconbtn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; padding: 0; flex: none; }
.iconbtn svg { width: 18px; height: 18px; } .iconbtn line, .iconbtn circle, .iconbtn path { stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }
.search { position: relative; flex: 1 1 22rem; max-width: 30rem; }
.search input { width: 100%; font: .9rem var(--font-body); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 52px 8px 34px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: .68rem var(--font-data); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: var(--panel); }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.2); max-height: 60vh; overflow-y: auto; padding: 6px; list-style: none; margin: 0; }
.results li button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: baseline; border: 0; background: transparent; padding: 7px 9px; border-radius: 5px; color: var(--ink); }
.results li button:hover, .results li button.on { background: var(--panel-2); }
.results .kind { font: 600 .68rem var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); min-width: 4.6rem; }
.results .sub { color: var(--muted); font-size: .78rem; margin-left: auto; }
.top-meta { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
/* Escamote un texte a l'ecran en le laissant aux lecteurs d'ecran. Sert aux
   coins de tableaux croises : une colonne d'etiquettes de lignes a bien un
   nom, il n'a simplement pas a s'afficher.
   Volontairement sans position:absolute. La recette habituelle place le
   texte par rapport au premier ancetre positionne ; dans un tableau large
   a defilement il n'y en a aucun, le texte atterrit donc au coin du document
   et elargit la page entiere. Mesure a 390 px : 622 px de large au lieu de
   390. Reste dans le flux, occupe 1 px, se lit toujours. */
.vh { display: inline-block; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.drop-ways { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.moved td .mono { font-size: .82rem; }
.moved th[scope='row'] { font-weight: 500; }
.tchip { font: 500 .74rem var(--font-body); font-variant-numeric: tabular-nums; color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 35; }
@media (max-width: 62em) {
  .app, .app.collapsed { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; transform: translateX(-105%); transition: transform .2s ease; visibility: visible !important; }
  .app.open .side { transform: none; }
  .top-meta { display: none; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

.wrap { width: 100%; max-width: 1320px; margin: 0 auto; padding-inline: 24px; padding-block: 24px 56px; display: flex; flex-direction: column; gap: 22px; }
@media (max-width: 40em) { .wrap { padding-inline: 16px; } .topbar { padding-inline: 12px; } }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.page-head h1 { font: 600 1.6rem/1.2 var(--font-body); letter-spacing: -.01em; }
.page-head p { color: var(--ink-2); margin-top: 3px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; cursor: pointer; white-space: nowrap; }
.claims td:last-child a { white-space: nowrap; }
/* Le bouton porte son propre bleu, un cran plus sombre que --info : blanc sur
   --info tombait a 4,41:1 pour un texte de 13,76 px, sous les 4,5 exiges. La
   palette de donnees reste inchangee, elle ne porte jamais de texte. */
.btn.primary { background: var(--info-solid); border-color: var(--info-solid); color: #fff; }
.page-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
@media (min-width: 88em) { .page-body.has-toc { grid-template-columns: minmax(0, 1fr) 200px; } }
.page-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.toc { display: none; }
@media (min-width: 88em) { .toc { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 82px; align-self: start; } }
.toc p { font: 600 .68rem var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 0 10px 8px; }
.toc button { text-align: left; border: 0; border-left: 2px solid var(--line); border-radius: 0; background: transparent; color: var(--ink-2); padding: 6px 10px; font: .82rem var(--font-body); }
.toc button:hover { color: var(--ink); border-left-color: var(--info); background: var(--panel-2); }
.panel { scroll-margin-top: 80px; }
/* overview: KPI cards with sparklines, main + feed, claims table */
.kcards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); }
.kcard { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: var(--ink); }
.kcard:hover { border-color: var(--info); }
.kcard .top { padding: 16px 18px 6px; display: flex; flex-direction: column; gap: 6px; }
.kcard .lab { display: flex; justify-content: space-between; align-items: center; font-size: .86rem; color: var(--ink-2); }
.kcard .ico { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; font: 700 .82rem var(--font-body); }
.kcard b { font: 600 1.9rem/1.1 var(--font-body); font-variant-numeric: lining-nums proportional-nums; letter-spacing: -.015em; }
.kcard .delta { font: 500 .8rem var(--font-body); font-variant-numeric: tabular-nums; }
.kcard .delta span { color: var(--muted); font-weight: 400; margin-left: 6px; }
.kcard svg { display: block; width: 100%; height: 64px; margin-top: auto; }
.ico.crit, .delta.crit { color: var(--crit-ink); } .ico.crit { background: var(--crit-bg); }
.ico.serious, .delta.serious { color: var(--serious-ink); } .ico.serious { background: var(--serious-bg); }
.ico.warn, .delta.warn { color: var(--warn-ink); } .ico.warn { background: var(--warn-bg); }
.ico.info, .delta.info { color: var(--info-ink); } .ico.info { background: var(--info-bg); }
.split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 75em) { .split { grid-template-columns: minmax(0, 2fr) minmax(18rem, 1fr); } }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.feed li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.feed li:last-child { border-bottom: 0; }
/* Les initiales sont decoratives (aria-hidden) mais restent du texte blanc sur
   une couleur d'identite : entre 2,81 et 3,2:1 selon la couche. L'ombre interne
   Elles recoivent donc 3 couleurs a elles, assez sombres pour porter du blanc.
   La palette des graphiques reste intacte : elle ne porte jamais de texte. */
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 700 .78rem var(--font-body); color: #fff; }
.feed p { font-size: .86rem; line-height: 1.4; }
.feed .when { font: .76rem var(--font-body); color: var(--muted); margin-top: 2px; }
.ph-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.claims td, .claims th { vertical-align: top; padding-block: 10px; }
.argtable th .lim { display: block; margin-top: 4px; font-weight: 400; font-style: italic; color: var(--ink-2); font-size: .82rem; }
.claims .lim { display: block; color: var(--muted); font-size: .78rem; font-weight: 400; margin-top: 2px; white-space: normal; }
.claims tbody th { white-space: normal; min-width: 16rem; }
.claims .fig { font: 600 1.05rem var(--font-body); font-variant-numeric: lining-nums; white-space: nowrap; }
.qh { font: 600 clamp(1.3rem, 2.4vw, 1.7rem)/1.22 var(--font-body); letter-spacing: -.01em; color: var(--ink); }
section.page { scroll-margin-top: 90px; }
section.page { display: flex; flex-direction: column; gap: 16px; }
section.page[hidden] { display: none; }

/* status strip: the question, its answer, the figures that decide it */
.strip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
@media (max-width: 52em) { .strip { grid-template-columns: 1fr; } }
.strip .q { padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; border-left: 6px solid var(--line); }
.strip.good .q { border-left-color: var(--good); } .strip.warn .q { border-left-color: var(--warn); } .strip.serious .q { border-left-color: var(--serious); } .strip.crit .q { border-left-color: var(--crit); } .strip.info .q { border-left-color: var(--info); }
.eyebrow { font: 600 .72rem/1.35 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--brass); }
.answer { font-size: 1.02rem; color: var(--ink-2); max-width: 62ch; margin: 0; }
ul.alist { padding-left: 1.2em; display: grid; gap: 3px; } ul.alist li::marker { color: var(--brass); }
.vline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; } .vline b { font-size: .95rem; color: var(--ink); }
.also { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.prov { overflow-wrap: anywhere; }
.scale { display: flex; flex-wrap: wrap; gap: 6px 14px; } .scale span { display: inline-flex; gap: 6px; align-items: center; font-size: .8rem; color: var(--ink-2); }
.strip .kpis { background: var(--panel-2); border-left: 1px solid var(--line); padding: 14px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); align-content: center; }
@media (max-width: 52em) { .strip .kpis { border-left: 0; border-top: 1px solid var(--line); } }
.kpi { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--line); border-radius: 6px; padding: 9px 11px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi.good { border-top-color: var(--good); } .kpi.warn { border-top-color: var(--warn); } .kpi.serious { border-top-color: var(--serious); } .kpi.crit { border-top-color: var(--crit); } .kpi.info { border-top-color: var(--info); }
.kpi b { font: 600 clamp(1.25rem, 3.6vw, 1.65rem)/1.1 var(--font-body); font-variant-numeric: lining-nums proportional-nums; letter-spacing: -.01em; overflow-wrap: anywhere; }
.kpi span { font-size: .78rem; color: var(--ink-2); line-height: 1.3; }
.kpi small { font: 500 .74rem var(--font-body); font-variant-numeric: tabular-nums; color: var(--muted); }

/* status badge: colour + icon + word, never colour alone */
.badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; font: 600 .72rem/1 var(--font-body); text-transform: uppercase; letter-spacing: .05em; padding: 6px 10px 6px 7px; border-radius: 999px; }
.badge i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font: 700 .7rem/1 var(--font-body); font-style: normal; color: #fff; }
.badge.good { background: var(--good-bg); color: var(--good-ink); } .badge.good i { background: var(--good); }

city his favourite setting in years, yet “almost wish[es] it wasn't wrapped up in a MOBA”."},{"who":"Anastasiia Sokolova, VGTimes","kind":"Press news","date":"2026-10-09","url":"https://vgtimes.com/articles/170520-is-deadlock-out-invite-only.html","veteran":false,"quote":"New players arrive only through people who already play.","themes":["outside"],"stance":"mixed","note":"Explains why the game is still invite-only despite record player counts: every newcomer starts with a friend who already plays."},{"who":"Steam forum, “previous map” thread","kind":"Player post","date":"2026-10-01","url":"https://steamcommunity.com/app/1422450/discussions/0/581683835681502492/","veteran":true,"quote":"Collectively they make fights harder to read.","themes":["readability"],"stance":"critical","note":"Misses the “clarity and simplicity” of the old map. About 30 replies split evenly; one answers “When you art up a game, you lose a little clarity.”"},{"who":"Steam forum, “visual clutter” thread","kind":"Player post","date":"2026-09-29","url":"https://steamcommunity.com/app/1422450/discussions/0/581683835681390004/","veteran":true,"quote":"the visual clutter is just insane","themes":["readability"],"stance":"critical","note":"Posted on the day of the City Never Sleeps update. Replies say the HUD gives up “focussed clear information” and ask for options to turn effects off."},{"who":"Steam forum, “newbie matchmaking protection”","kind":"Player post","date":"2026-08-29","url":"https://steamcommunity.com/app/1422450/discussions/0/581680955258905019/","veteran":false,"quote":"How exactly am I supposed to improve if every game I play I get carried or stomped","themes":["punish"],"stance":"critical","note":"30 matches in, the poster notes each recent MVP had about 3× their wins and asks for a protected new-player pool."},{"who":"Tyler Colp, PC Gamer","kind":"Press analysis","date":"2026-08-04","url":"https://www.pcgamer.com/games/moba/deadlocks-new-ranked-mode-is-driving-players-mad-as-they-try-to-escape-the-casual-modes-and-climb-back-to-where-they-were/","veteran":false,"quote":"Deadlock is a game with a lot of barriers to entry","themes":["punish","learning"],"stance":"critical","note":"Ranked’s win gates keep players in Standard, with “a wider spread of skill levels”; the small player pool makes match quality “waver”."},{"who":"Ethan Smith, FinalBoss.io","kind":"Press news","date":"2026-08-01","url":"https://finalboss.io/deadlocks-ranked-season-has-a-steep-entry-gate-and-a-thin-queue-problem","veteran":false,"quote":"Players who have focused on a single main must build a functional three-hero pool before they can start calibration","themes":["punish"],"stance":"mixed","note":"Headlined “a steep entry gate and a thin queue problem”. Grants that the gate should keep brand-new accounts out, but warns of “broader skill ranges within matches”."},{"who":"Callum Doyle, Dexerto","kind":"Press news","date":"2026-08-01","url":"https://www.dexerto.com/gaming/valve-overhauls-deadlocks-matchmaking-with-new-ranked-mode-3393828/","veteran":false,"quote":"Standard Mode continues to serve as a lower-stakes way to play with friends.","themes":["defence"],"stance":"defence","note":"Presents the July 30 rework as it was designed: an 8-match calibration, solo and duo Ranked, and Standard as the open queue."},{"who":"Ben Powell, The Courier","kind":"Press review","date":"2026-03-24","url":"https://www.thecourieronline.co.uk/deadlock-a-review/","quote":"Deadlock's learning curve is pretty steep","themes":["learning"],"stance":"critical","note":"Calls the number of new items, abilities and map details “quite overwhelming” for newcomers; points to the shop’s Public Builds as the way out."},{"who":"Harvey Randall, PC Gamer (via Wikipedia)","kind":"Press column","date":"2026-02","url":"https://en.wikipedia.org/wiki/Deadlock_(video_game)","quote":"I'm sad Deadlock is 'just' a MOBA","themes":["moba"],"stance":"critical","note":"Regrets that the game ended up as a MOBA despite orum, same thread","kind":"Player post","date":"2025-02-27","url":"https://steamcommunity.com/app/1422450/discussions/0/598519309481862227/","quote":"kinda barebones","themes":["tutorial"],"stance":"critical","note":"On the tutorial: still does not know “half the mechanics and map objectives”."},{"who":"Steam forum, “not fun for new players” thread","kind":"Player post","date":"2025-02-22","url":"https://steamcommunity.com/app/1422450/discussions/0/598519309481862227/","quote":"tried reading beginner guides but I keep dying","themes":["outside","punish"],"stance":"critical","note":"Found it “really unmotivating and frustrating as a new player to learn”."},{"who":"Steam forum, same thread","kind":"Player post","date":"2025-02-22","url":"https://steamcommunity.com/app/1422450/discussions/0/598519309481862227/","quote":"an economy that almost universally punishes you for doing anything but sitting in lane farming","themes":["punish","items"],"stance":"critical","note":"The punishment is economic: leaving lane costs souls."},{"who":"Steam forum, new-player thread","kind":"Player post","date":"2025-02-13","url":"https://steamcommunity.com/app/1422450/discussions/0/570371033831364963/","quote":"a moba with A LOT OF OVERCOMPLICATION","themes":["learning","tutorial","items"],"stance":"critical","note":"Says the tutorial covers objectives and farming, “that's about it”; questions the number of active items and flex slots."},{"who":"Steam forum, reply in the same thread","kind":"Player post","date":"2025-02-13","url":"https://steamcommunity.com/app/1422450/discussions/0/570371033831364963/","quote":"One of the best ways to learn something is to be subjected to it","themes":["defence"],"stance":"defence","note":"Argues each system is simple alone and that they interlock; grants that Valve has rarely been good at tutorials."},{"who":"Joe Lee, Medium","kind":"Essay","date":"2024-10-04","url":"https://medium.com/@jllee88/deadlock-can-valves-complex-moba-shooter-achieve-mainstream-success-2a10e91a02b2","quote":"more punishing than fun, especially early on","themes":["learning","punish","outside"],"stance":"critical","note":"Says learning builds is “just the beginning”; community build guides help but do not remove the difficulty."},{"who":"Yoshi, Deadlock developer, Discord (Aug 2024, quoted by Lucid)","kind":"Developer statement","date":"2024-08","url":"https://www.youtube.com/watch?v=t61E81PVBK8","quote":"you'll learn some of those things over time","themes":["defence"],"stance":"defence","note":"Full line: the model is not to “overwhelm you with information at the start”. Valve’s stated design is learning by playing, which Street Brawl later embodied."}],"outside":[{"name":"deadlock-api.com","type":"Match statistics API","url":"https://api.deadlock-api.com/docs","note":"Open API with item, hero and build analytics; used on this dashboard."},{"name":"Tracklock","type":"Stats tracker and builds","url":"https://tracklock.gg/articles/tracklocks-builds-just-got-even-better","note":"Player stats and curated builds."},{"name":"Deadlock Labs","type":"Stats tracker","url":"https://deadlocklabs.gg/about/","note":"Stats site with a mobile app."},{"name":"Mobalytics","type":"Build statistics per hero","url":"https://mobalytics.gg/deadlock/build-stats","note":"One build-stats page per hero."},{"name":"Deadlock Build Planner & Calculator","type":"Build calculator","url":"https://peerpush.com/p/deadlock-build-planner-and-calculator","note":"Computes builds outside the game."},{"name":"MOBA Builds: Deadlock Guides","type":"Mobile app","url":"https://apps.apple.com/app/id6770762003","note":"App Store app dedicated to Deadlock builds."},{"name":"esports.gg tier list","type":"Tier list","url":"https://esports.gg/guides/deadlock/deadlock-tier-list/","note":"Ranks heroes for players."},{"name":"esports.net tier list","type":"Tier list","url":"https://www.esports.net/wiki/guides/deadlock-tier-list-best-heroes/","note":"Ranks heroes for players."},{"name":"Dexerto Deadlock directory","type":"Guide portal","url":"https://www.dexerto.com/gaming/deadlock-directory-dexerto-guides-2971901","note":"25 guides in one index (Nov 2024), 20 of them build guides."},{"name":"esports.gg build guide","type":"How-to guide","url":"https://esports.gg/guides/deadlock/how-to-create-a-build-or-a-use-a-public-one-in-deadlock","note":"Explains how to find and copy public builds in the shop."},{"name":"Mobalytics movement guide","type":"Movement guide","url":"https://mobalytics.gg/deadlock/guides/movement-guide","note":"Dash-jumps, slides and tech the tutorial does not cover."},{"name":"Beebom advanced movement guide","type":"Movement guide","url":"https://beebom.com/deadlock-advanced-movement-guide/amp/","note":"“How to Dash Jump, Slide Jump, and More”."},{"name":"Metabot movement guide","type":"Movement guide","url":"https://metabot.gg/en/deadlock/guides/deadlock-movement-mechanics-guide","note":"Dash-jumping, sliding and zipline tech."},{"name":"deadlock.wiki hero movement pages","type":"Movement guide (per hero)","url":"https://deadlock.wiki/Lash/Movement","note":"Movement tech documented hero by hero, e.g. Lash."}],"defenders":[{"channel":"Tobiiask","title":"Deadlock Isn’t As Hard As You Think","date":"2026-02-02","url":"https://www.youtube.com/watch?v=vocU7rwg378","hours":"1,000+ hours","defends":"Deadlock looks complicated from the outside, but it really isn't.","concedes":"Now, this part can be very overwhelming, and my advice to you is do not panic. You can use the browse build option…","args":["easy","builds","annotations","movement","laning","rejuv"]},{"channel":"Eskay","title":"Learn Deadlock in 15 Minutes (it’s not as hard as you think!)","date":"2026-01-29","url":"https://www.youtube.com/watch?v=EvxVSvzZcxA","hours":"Ascendant rank","defends":"I'm ascended even though I just buy stuff left or right on public build guides, and that's the beauty of Dead Lock.","concedes":"…it is very difficult and overwhelming when you first start out. Many people get turned away before ever seeing the magic…","args":["easy","builds","nometa","tutorial","rejuv"]},{"channel":"Mugthief","title":"Deadlock is peak Valve. Here’s why.","date":"2026-02-13","url":"https://www.youtube.com/watch?v=iaEDzNR-9_s","hours":"800 hours","defends":"…learn the game by enjoying playing it, not by looking at textbooks. It's still a video game, guys.","concedes":"…it's a very, very long road until you fully understand what it is, until you really know how to play the game.","args":["play","annotations","laning","aim","queue","rejuv"]},{"channel":"Deathy","title":"Is Deadlock Too Complicated? | A Response To @xQcOW","date":"2025-08-27","url":"https://www.youtube.com/watch?v=nxafA2cxyic","hours":"3,000+ hours","defends":"…part of the beauty of Deadlock is kind of learning it and figuring out what's good and what's bad.","concedes":"The learn how to play in-game is frankly a bit of a joke… It's impossible to tell what's important from what's not important.","args":["tutorial","timers","outside"]},{"channel":"Doktor Skipper","title":"Deadlock: The Best Game That Isn’t Out (yet)","date":"2026-09-18","url":"https://www.youtube.com/watch?v=U5ztlqC765g","hours":"Long-time player","defends":"…with the smallest effort to study it, the item shop morphs from a scary Elden Ring monster to a Master Chef Challenge rack…","concedes":"It is a kick in the teeth for a long time. Then there is no immediate gratification. You will suck for 50 games and you're going to piss everyone off…","args":["transparent","annotations","queue"]},{"channel":"Couch Co-Op","title":"Deadlock is About To Change Gaming Forever…","date":"2025-09-29","url":"https://www.youtube.com/watch?v=hEiIlCRha1M","hours":"Self-described addict","defends":"People don't have time to make a game into a second job. Unless that second job doesn't feel like a job.","concedes":"I'm not going to sit here and tell you that this game is easy to figure out. It's not. You'll spend a considerable amount of time just learning how the items work.","args":["builds","annotations"]},{"channel":"Aztecross","title":"My Honest Review of Deadlock","date":"2026-02-11","url":"https://www.youtube.com/watch?v=Opm4WVDhCSE","hours":"One week in","defends":"…the complexity is something that's not hid. They threw the whole spreadsheet in your face, and they said, \"Learn it.\"","concedes":"…how long will it take us to master this game? And to that, thousands of hours.","args":["transparent","builds"]},{"channel":"In Theory Tho","title":"Deadlock is Valve’s Masterpiece…Unless They Kill It","date":"2026-03-20","url":"https://www.youtube.com/watch?v=KFwiuoJ_NyA","hours":"Calls it “my home”","defends":"It's not a traditional MOBA, which makes it more accessible than other titles. By accessible, I don't mean easy…","concedes":"Players can spend 30 to 40 hours just getting familiar with the game's mechanics… they will quickly hit a skill wall.","args":["aim","queue"]}],"comments":[{"who":"@N00BSYBORG","where":"YouTube community post","date":"2026-10-12","url":"https://www.youtube.com/post/UgkxRBrPxh7txb2Qxn7PSrRtiy2axU-0aJHk?lc=UgwBRyRB5Ddu90Hezm54AaABAg","quote":"…there's no amount of tutorialization you can do to fix that. There's hundreds, if not thousands, of variables in a MOBA… The only way to learn everything is to play for hundreds of hours.","arg":"notutorial"},{"who":"@captainnomekop5056","where":"YouTube comment","date":"2026-10","url":null,"quote":"YOU HAVE TO WIN 15 STANDARD MATCHES FOR EVERY CHARACTER YOU WANT TO PLAY IN RANKED… I need a place where I can learn and get used to the full experience without the pressure of making someone else's day miserable.","arg":"queue"},{"who":"@Lazerlerx","where":"Reply to the comment above","date":"2026-10","url":null,"quote":"Yeah standard queue will always be dogshit for both sides until this issue gets resolved.","arg":"queue"}],"sbmm":{"quotes":[{"who":"Yoshi, Deadlock developer (Discord), via PCGamesN","url":"https://www.pcgamesn.com/deadlock/mmr-changes","date":"2025","quote":"The hero-based MMR one doesn't work very well at the moment. It'll be more effective once we finish a full rewrite of the MM system we are working on."},{"who":"Yoshi, Deadlock developer (Discord), via PCGamesN","url":"https://www.pcgamesn.com/deadlock/mmr-changes","date":"2025","quote":"The primary way this happens is one medium/high MMR player partied with a low MMR/new player."},{"who":"Yoshi, via PCGamesN","url":"https://www.pcgamesn.com/deadlock/matchmaking-fixes","date":"2025","quote":"We are making a change to how we matchmake with parties."},{"who":"Valve, ranked launch, via PC Gamer (Tyler Colp)","url":"https://pcgamer.com/games/moba/valve-finally-gives-deadlock-a-proper-ranked-mode-warns-that-matches-will-be-very-rocky-to-start","date":"2026-07-30","quote":"expect the next week or so to be very rocky"},{"who":"Player post, official Deadlock forum","url":"https://forums.playdeadlock.com/threads/why-are-we-forced-to-smurf-how-deadlock%E2%80%99s-%E2%80%9Csmart%E2%80%9D-matchmaking-breeds-the-problem-it-claims-to-solve.131092/","date":"2026-05","quote":"Rank and victory have become two different objectives, and the system has quietly chosen which one it actually measures."}],"ranked_gate":{"text":"60 wins, then 15 wins on each of at least 3 heroes, to unlock Ranked","src":"deadlock.wiki, Update: July 30, 2026","url":"https://deadlock.wiki/Update:July_30,_2026"}},"lucid_complexity":{"quote":"The main problem that Deadlock faces when reaching new player is not its complexity, but the way in which that complexity is introduced to the player.","quote2":"traditional sports like cricket, golf, basketball, American football, and chess all have incredible amounts of complexity […] But no one would describe these games as too hard for new players to learn because they each have established ways of gradually teaching players how to play them.","who":"Lucid, “Deadlock’s New Player Problem”","url":"https://www.youtube.com/watch?v=t61E81PVBK8","date":"2026-10-12"},"lucid_proposal":{"quote":"a focus map made specifically for teaching new players would be better at funneling the player's attention at specific things","limit":"no matter how good the tutorial is, there's nothing that can prepare the player for the second major problem that Deadlock has for newbies","who":"Lucid, “Deadlock’s New Player Problem”","url":"https://www.youtube.com/watch?v=t61E81PVBK8","steps":[{"label":"Running, jumping, sliding, air dashing","mech":["Jump and double jump","Slide","Air dash"]},{"label":"All four of Seven’s abilities","check":"Sandbox_Tutorial_Abilities_Cast_desc"},{"label":"Climb a pole up to the bell tower","mech":["Ropes"]},{"label":"What the tower and the boxes give","mech":["Crates and permanent buffs"]},{"label":"Neutral camps in the sunken plaza","mech":["Neutral creeps"]},{"label":"Stamina, and evading without it","mech":["Stamina"]}]},"critic":{"channel":"SouthernNinja","videos":[{"id":"honest","title":"Deadlock: My Honest Thoughts","date":"2024-08-28","url":"https://www.youtube.com/watch?v=GXeeN-F5yTw"},{"id":"opinion","title":"You’re Not Allowed An Opinion On Deadlock","date":"2024-09-18","url":"https://www.youtube.com/watch?v=XFF6GCHqArE"},{"id":"2026","title":"Deadlock","date":"2026-01-28","url":"https://www.youtube.com/watch?v=cruHeYw9EEw"},{"id":"sucks","title":"Deadlock Still Sucks","date":"2026-10-06","url":"https://www.youtube.com/watch?v=fZd8Ax0SR7M"}],"args":[{"k":"moba","v":["honest","2026"],"arg":"It is a MOBA first; the shooter half is held back by it","quote":"the second half of this game is bad because it’s hindered by the first half"},{"k":"ttk","v":["2026","sucks"],"arg":"Time to kill is far too long for a shooter","quote":"Time to kill has not been addressed at all in this game."},{"k":"actives","v":["sucks"],"arg":"Active items are broken: stun chains, full immunity","quote":"if you removed all of the active items from this game, there’d be virtually nothing to complain about"},{"k":"unexplained","v":["opinion"],"arg":"Crates, urns and permanent buffs go unexplained in game","quote":"it goes completely unexplained in-game and new players don’t even know it exists"},{"k":"respawn","v":["opinion"],"arg":"You wait a full minute to respawn","quote":"go back to spawn and wait an entire full minute to respawn"},{"k":"stomp","v":["opinion"],"arg":"Matches are decided at mid game, then you get stomped for 50 minutes","quote":"matches are typically already decided at about mid game"},{"k":"read","v":["opinion","honest"],"arg":"You cannot read an enemy’s build, and late fights are visual noise","quote":"you have no real way of telling what build an enemy has until you’re already fighting them"},{"k":"lanes","v":["2026"],"arg":"Valve went from 5 lanes to 3","quote":"changing it from five lanes on the main standard moba game to three lanes"}],"untested":"Performance, hit detection, art direction, character design and claims about who builds the game are outside what client files and match statistics can show."},"principles":[{"k":"teach","name":"Teach by playing, one step at a time","who":"Shigeru Miyamoto on World 1-1, via Game Developer (2015)","url":"https://gamedeveloper.com/design/how-miyamoto-built-i-super-mario-bros-i-legendary-world-1-1","quote":"help the player “gradually and naturally understand what they’re doing”","reading":""},{"k":"memory","name":"Working memory holds about 4 chunks","who":"Nelson Cowan, Behavioral and Brain Sciences (2001)","url":"https://pubmed.ncbi.nlm.nih.gov/11515286/","quote":"“The magical number 4 in short-term memory”","reading":""},{"k":"read","name":"Players must read each other at a glance","who":"Mitchell, Francke and Eng (Valve), “Illustrative Rendering in Team Fortress 2” (2007)","url":"https://www.cs.princeton.edu/courses/archive/fall07/cos597B/papers/mitchell-team-fortress.pdf","quote":"players “must be able to visually identify other players very quickly”","reading":""},{"k":"choice","nam function rankLine(tiers, key, { fmt, color, label, ymin = null, pct = false }) {
  const W = 440, Hh = 250, P = { l: 58, r: 22, t: 22, b: 74 };
  const vals = tiers.map(t => t[key] * (pct ? 100 : 1));
  const lo = ymin ?? Math.min(...vals) * .95, hi = Math.max(...vals) * 1.03;
  const x = i => P.l + i / (tiers.length - 1) * (W - P.l - P.r), y = v => Hh - P.b - (v - lo) / (hi - lo) * (Hh - P.t - P.b);
  const s = svg('svg', { viewBox: `0 0 ${W} ${Hh}`, class: 'chart', role: 'img', 'aria-label': label });
  const g = svg('g', { class: 'grid' }); s.append(g);
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g.append(svg('line', { x1: P.l, x2: W - P.r, y1: y(v), y2: y(v) })); s.append(svg('text', { x: P.l - 6, y: y(v) + 4, 'text-anchor': 'end' }, fmt(v))); }
  tiers.forEach((t, i) => { const tx = svg('text', { x: x(i) + 3, y: Hh - P.b + 14, 'text-anchor': 'end', transform: `rotate(-50 ${x(i) + 3} ${Hh - P.b + 14})` }, t.name); s.append(tx); });
  s.append(svg('polyline', { points: vals.map((v, i) => `${x(i)},${y(v)}`).join(' '), fill: 'none', stroke: color, 'stroke-width': 2.5 }));
  tiers.forEach((t, i) => s.append(svg('circle', { cx: x(i), cy: y(vals[i]), r: i === 0 || i === tiers.length - 1 ? 6 : 4, fill: color, stroke: 'var(--panel)', 'stroke-width': 2, 'data-tip': `${t.name}: ${fmt(vals[i])} (${nf.format(t.matches)} matches)` })));
  for (const i of [0, tiers.length - 1]) s.append(svg('text', { x: x(i) + (i ? -8 : 8), y: y(vals[i]) + (vals[i ? i - 1 : 1] > vals[i] ? 18 : -10), 'text-anchor': i ? 'end' : 'start', class: 'lab' }, fmt(vals[i])));
  return withTable(s, ['Rank', label, 'Matches'], tiers.map((t, i) => [t.name, fmt(vals[i]), nf.format(t.matches)]));
}

const MAPD = GAME.map, HIST = GAME.history;
const LANE_COL = ['var(--l4)', 'var(--l1)', 'var(--l3)'];
const mmss = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
function histStats() {
  const days = [...new Set(HIST.updates.filter(u => u.total > 0).map(u => u.date))].sort();
  const t = d => Date.parse(d + 'T00:00:00Z') / 864e5;
  const gaps = days.slice(1).map((d, i) => t(d) - t(days[i]));
  const start = t(HIST.since), end = t(GAME.source.commit_date);
  let win = 0, tot = 0;
  for (let x = start; x + 30 <= end; x++) { tot++; if (days.some(d => t(d) >= x && t(d) < x + 30)) win++; }
  const lanes = HIST.lane_steps.map(l => ({ date: l.date, n: { two: 2, three: 3, four: 4 }[(l.text.match(/(two|three|four) lanes/) || [])[1]], text: l.text }));
  const cut = lanes.find((l, i) => i && l.n !== lanes[i - 1].n);
  return { days, med: median(gaps), maxGap: Math.max(...gaps), share: win / tot, retuned: sum(HIST.updates.map(u => u.total)), lanes, cut,
    months: Math.round((end - start) / 30.4) };
}

  const byDay = {};
  for (const u of HIST.updates) { const g = byDay[u.date] ??= {}; for (const [k, v] of Object.entries(u.groups)) g[k] = (g[k] || 0) + v; }
  const GROUPS = [['Troopers', 'var(--l2)'], ['Guardians, Walkers, base', 'var(--l5)'], ['Neutral camps', 'var(--l3)'], ['Mid boss', 'var(--slot-spirit)'], ['Map rules', 'var(--l1)']];
  const mx = Math.max(...Object.values(byDay).map(g => sum(Object.values(g)))), top = Math.ceil(mx / 25) * 25;

  const marks = [[HS.cut?.date, `${HS.lanes[0].n} → ${HS.cut?.n} lanes`], ...HS.lanes.filter(l => /zipline/.test(l.text)).slice(0, 1).map(l => [l.date, '“transit line” renamed “zipline”']),

  marks.forEach(([d, label], i) => { s.append(svg('line', { x1: x(d), x2: x(d), y1: P.t - 6, y2: Hh - P.b, class: 'mark' }));

// ------------------------------------------------------------ matchmaking (SBMM): how players are matched and what it does to learning
const MMR = GAME.matchmaking, MMQ = GAME.voices.sbmm;
// Match quality from bulk match metadata: who wins, by how much, how long, and which pools and parties were involved.
function matchQuality(ms) {
  const rows = ms.filter(m => m.winning_team != null && m.duration_s > 0).map(m => {
    const o0 = badgeOrd(m.average_badge_team0), o1 = badgeOrd(m.average_badge_team1), w = teamOf(m.winning_team);
    const nw = [[], []]; for (const p of m.players || []) { const t = teamOf(p.team); if (t != null && p.net_worth != null) nw[t].push(p.net_worth); }
    const W = sum(nw[w]), L = sum(nw[1 - w]), tot = W + L;
    const weakest = a => a.length ? Math.min(...a) / (sum(a) / a.length) : null;
    return { gap: o0 != null && o1 != null ? Math.abs(o0 - o1) : null, higherWins: o0 != null && o1 != null && o0 !== o1 ? (o0 > o1 ? 0 : 1) === w : null,
      lead: tot ? (W - L) / tot : null, min: m.duration_s / 60, t: Date.parse(String(m.start_time).replace(' ', 'T') + 'Z'),
      newPool: m.new_player_pool, wide: m.is_high_skill_range_parties, lowPri: m.low_pri_pool, notScored: m.not_scored, weakL: weakest(nw[1 - w]) };
  });
  const share = (a, f) => a.length ? a.filter(f).length / a.length : null;
  const flag = k => share(rows.filter(r => r[k] != null), r => r[k]);
  const g = rows.filter(r => r.gap != null), L = rows.filter(r => r.lead != null);
  const GB = [['same subrank', r => r.gap === 0], ['1–2 subranks', r => r.gap >= 1 && r.gap <= 2], ['3–5', r => r.gap >= 3 && r.gap <= 5], ['a full rank or more', r => r.gap >= 6]];
  const LEN = [['under 25 min', r => r.min < 25], ['25–35 min', r => r.min >= 25 && r.min < 35], ['35–45 min', r => r.min >= 35 && r.min < 45], ['45 min or more', r => r.min >= 45]];
  const ts = rows.map(r => r.t).filter(Number.isFinite);
  const acc = new Set(); let slots = 0; for (const m of ms) for (const p of m.players || []) { slots++; if (p.account_id) acc.add(p.account_id); }
  return { n: rows.length, hours: ts.length ? (Math.max(...ts) - Math.min(...ts)) / 36e5 : null, to: ts.length ? new Date(Math.max(...ts)).toISOString().slice(0, 10) : null,
    gapN: g.length, gapMed: g.length ? median(g.map(r => r.gap)) : null,
    gaps: GB.map(([k, f]) => { const a = g.filter(f), h = a.filter(r => r.higherWins != null); return { k, share: g.length ? share(g, f) : null, higherWins: h.length ? share(h, r => r.higherWins) : null }; }),
    leadMed: L.length ? median(L.map(r => r.lead)) : null, close: share(L, r => r.lead < .05), clear: share(L, r => r.lead >= .05 && r.lead < .15), stomp: share(L, r => r.lead >= .15),
    byLen: LEN.map(([k, f]) => { const a = L.filter(f); return { k, share: share(rows, f), lead: a.length ? median(a.map(r => r.lead)) : null }; }),
    minMed: median(rows.map(r => r.min)), over45: share(rows, r => r.min >= 45), over60: share(rows, r => r.min >= 60), under25: share(rows, r => r.min < 25),
    newPool: flag('newPool'), wide: flag('wide'), lowPri: flag('lowPri'), notScored: flag('notScored'),
    stompWide: share(L.filter(r => r.wide), r => r.lead >= .15), stompNotWide: share(L.filter(r => r.wide === false), r => r.lead >= .15),
    weakL: median(rows.map(r => r.weakL).filter(v => v != null)), accounts: acc.size, slots };
}
function mmStats() {
  if (!API || !API.novices || !API.veterans) return null;
  const wr = a => sum(a.map(r => r.wins)) / sum(a.map(r => r.matches));
  return { nv: wr(API.novices), vt: wr(API.veterans), nvM: sum(API.novices.map(r => r.matches)), vtM: sum(API.veterans.map(r => r.matches)),
    std: RAW.mStd ? matchQuality(RAW.mStd) : API.mmq?.std || null, rk: RAW.mRk ? matchQuality(RAW.mRk) : API.mmq?.rk || null };
}

function mmSplit(Q) {
  // The comment's split against what the two queues measure: one-sided, clear, close.
  const rows = [['The comment', { stomp: .5, clear: 0, close: .5 }, 'claimed'], ...Q.map(([k, q]) => [k, q, `${nf.format(q.n)} matches`])];
  const W = 900, rowH = 40, LW = 170, Hh = rows.length * rowH + 30;
  const X = v => LW + v * (W - LW - 10);
  const s = svg('svg', { viewBox: `0 0 ${W} ${Hh}`, class: 'chart', role: 'img', 'aria-label': `One-sided, clear and close matches: the comment claims ${pct(.5)} one-sided; Standard measures ${pct(Q[0][1].stomp)}.` });
  const SEG = [['stomp', 'One-sided (lead ≥ 15)', 'var(--crit)'], ['clear', 'Clear win (5–15)', 'var(--warn)'], ['close', 'Close (< 5)', 'var(--good)']];
  rows.forEach(([k, q, sub], i) => { const y = 8 + i * rowH; let acc = 0;
    s.append(svg('text', { x: 0, y: y + 15, class: 'lab' }, k)); s.append(svg('text', { x: 0, y: y + 28, class: 'sm' }, sub));
    for (const [f, label, c] of SEG) { const v = q[f] || 0; if (!v) continue;
      s.append(svg('rect', { x: X(acc), y: y + 4, width: Math.max(1, X(acc + v) - X(acc) - 2), height: 26, rx: 4, fill: c, opacity: i ? .85 : .35, 'data-tip': `${k} · ${label}: ${pct(v)}` }));
      if (v > .07) s.append(svg('text', { x: X(acc + v / 2), y: y + 21, 'text-anchor': 'middle', class: 'lab onbar' + (f === 'clear' ? ' dark' : '') }, pct(v)));
      acc += v; } });
  for (const v of [0, .25, .5, .75, 1]) s.append(svg('text', { x: X(v), y: Hh - 4, 'text-anchor': v === 1 ? 'end' : v === 0 ? 'start' : 'middle' }, Math.round(v * 100) + '%'));
  withTable(s, ['', ...SEG.map(x => x[1])], rows.map(([k, q]) => [k, ...SEG.map(([f]) => pct(q[f] || 0))]));
  return el('div', {}, s, el('div', { class: 'legend' }, ...SEG.map(([, t, c]) => el('span', {}, el('i', { style: `background:${c}` }), t))));
}

  const id = pages.some(p => p.id === location.hash.slice(1)) ? location.hash.slice(1) : 'overview';
  const page = pages.find(p => p.id === id);
  pages.forEach(p => { p.hidden = p !== page; });
  for (const a of nav.querySelectorAll('a')) a.hash === '#' + id ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  document.title = id === 'overview' ? 'Deadlock Learning Load' : `${page.dataset.title} · Deadlock Learning Load`;
  const i = pages.indexOf(page), prev = pages[i - 1], next = pages[i + 1];
  $('#pager').replaceChildren(...[prev && el('a', { href: '#' + prev.id }, el('span', { text: 'Previous' }), '← ' + prev.dataset.title),
    next && el('a', { class: 'next', href: '#' + next.id }, el('span', { text: 'Next' }), next.dataset.title + ' →')].filter(Boolean));
  if (mobile.matches) closeSide();
  if (scroll) window.scrollTo(0, 0);
}
burger.addEventListener('click', () => {
  if (mobile.matches) { const o = app.classList.toggle('open'); backdrop.hidden = !o; burger.setAttribute('aria-expanded', String(o)); if (o) nav.querySelector('[aria-current]')?.focus(); }
  else { const c = app.classList.toggle('collapsed'); burger.setAttribute('aria-expanded', String(!c)); }
});
burger.setAttribute('aria-expanded', String(!mobile.matches));
backdrop.addEventListener('click', closeSide);
document.addEventListener('click', async e => { const b = e.target.closest('[data-copylink]'); if (!b) return;
  const url = location.href.split('#')[0] + '#' + b.dataset.copylink;
  try { await navigator.clipboard.writeText(url); b.textContent = 'Copied'; } catch { b.textContent = 'Copy failed'; }
  setTimeout(() => { b.textContent = 'Copy link'; }, 1500); });
addEventListener('hashchange', () => show());

// search: pages, heroes, mechanics, voices, items
const q = $('#q'), res = $('#results');
function searchIndex() {
  const out = pages.map(p => ({ kind: 'Page', label: p.dataset.title, sub: p.dataset.sub || 'Summary', go: () => { location.hash = p.id; } }));
  for (const h of H) out.push({ kind: 'Hero', label: h.name, sub: 'item builds', go: () => { heroSel = String(h.id); itemsPage(); chrome($('#items')); location.hash = 'items'; show(); } });
  for (const m of GAME.mechanics) out.push({ kind: 'Mechanic', label: m.name, sub: m.in_tutorial ? 'in tutorial' : 'not in tutorial', go: () => { location.hash = 'tutorial'; } });
  for (const v of GAME.voices.voices) out.push({ kind: 'Voice', label: v.quote, sub: v.who.split(',')[0], go: () => { location.hash = 'voices'; } });
  for (const i of ITEMS) out.push({ kind: 'Item', label: i.name, sub: `${i.slot}, tier ${i.tier}`, go: () => { location.hash = 'items'; } });
  return out;
}
let IDX = null, hits = [], cur = 0;
function drawResults() {
  res.replaceChildren(...hits.map((h, i) => { const b = el('button', { type: 'button', class: i === cur ? 'on' : null, role: 'option' }, el('span', { class: 'kind', text: h.kind }), el('span', { text: h.label }), el('span', { class: 'sub', text: h.sub }));
    b.addEventListener('click', () => pick(i)); return el('li', {}, b); }));
  res.hidden = !hits.length; q.setAttribute('aria-expanded', String(!!hits.length));
}
function pick(i) { const h = hits[i]; if (!h) return; q.value = ''; hits = []; drawResults(); q.blur(); h.go(); }
q.addEventListener('input', () => {
  IDX ??= searchIndex();
  const t = q.value.trim().toLowerCase(); cur = 0;
  hits = t ? IDX.filter(x => (x.label + ' ' + x.sub).toLowerCase().includes(t)).slice(0, 12) : [];
  drawResults();
});
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { cur = Math.min(hits.length - 1, cur + 1); drawResults(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { cur = Math.max(0, cur - 1); drawResults(); e.preventDefault(); }
  else if (e.key === 'Enter') { pick(cur); e.preventDefault(); }
  else if (e.key === 'Escape') { hits = []; drawResults(); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape' && app.classList.contains('open')) { closeSide(); burger.focus(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) { hits = []; drawResults(); } });
renderAll();
})();
</script>
</body>
