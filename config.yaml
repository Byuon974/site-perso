# baseURL: "https://byuon974.github.io/site-perso/"
baseURL: "https://nexus-tvs.xyz/"
locale: "fr-FR"
defaultContentLanguage: "fr"
title: "Thomas | Développeur en formation"
publishDir: "docs"

# Désactiver les pages de listes de tags (/tags/, /tags/python/, etc.)
# Les tags restent utilisables dans les templates (affichage, articles liés)
disableKinds:
  - taxonomy
  - term

taxonomies:
  tag: tags

# Paramètres personnalisés
params:
  author: "Thomas"
  description: "Développeur à La Réunion : applications métier de bout en bout, avec une culture d'infrastructure Linux. MSc IA & Big Data à Epitech, en recherche d'alternance."
  email: "thomasvs974.ent@gmail.com"
  linkedin: "https://www.linkedin.com/in/thomas-vinh-san-756037434"
  cv: "cv/cv-thomas.pdf"

# Menus (URLs RELATIVES – IMPORTANT pour GitHub Pages /site-perso/)
menu:
  main:
    - name: "Projets"
      url: "projets/"
      weight: 1
    - name: "Blog"
      url: "blog/"
      weight: 2
    - name: "Notes"
      url: "notes/"
      weight: 3
    - name: "À propos"
      url: "about/"
      weight: 4

# Markdown
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: monokai
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 2
    ordered: false

# Outputs
outputs:
  home:
    - HTML
    - RSS
  # Un flux par section : les 4 articles du blog et les 10 fiches techniques
  # n'ont pas la même cadence, et on doit pouvoir s'abonner à l'une sans
  # l'autre. Produit /blog/index.xml, /notes/index.xml, /projets/index.xml.
  section:
    - HTML
    - RSS

# Les feuilles de style restent dans static/css, où elles ont toujours été,
# mais sont montées aussi dans assets/ pour que Hugo puisse les concaténer,
# minifier et empreinter (voir head.html). Le montage de static exclut donc
# /css/**, sinon chaque feuille serait publiée une seconde fois, telle
# quelle et sans empreinte, à côté du paquet.
module:
  mounts:
    - source: static
      target: static
      files:
        - '! css/**'
    - source: static/css
      target: assets/css
    # Le CV est monté dans assets uniquement pour que le gabarit puisse
    # calculer une empreinte de son contenu. Le fichier reste publié par
    # static/, à son adresse habituelle.
    - source: static/cv
      target: assets/cv
