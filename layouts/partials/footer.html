<footer class="site-footer">
  <div class="site-footer-inner">
    <span class="site-footer-copy">
      © {{ now.Year }} {{ .Site.Params.author | default "Thomas" }}
    </span>
    <nav class="site-footer-links" aria-label="Liens de pied de page">
      <a href="{{ "about/" | relURL }}">À propos</a>
      <a href="{{ "uses/" | relURL }}">Ce que j'utilise</a>
      {{ with .Site.Params.linkedin }}
      <a href="{{ . }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      {{ end }}
      {{ with .Site.Params.email }}
      <a href="mailto:{{ . }}">Contact</a>
      {{ end }}
      <a href="{{ "tout/" | relURL }}">Tout le contenu</a>
      <a href="{{ "flux/" | relURL }}">Flux</a>
    </nav>
  </div>
</footer>
